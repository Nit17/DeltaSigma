name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,ml,research]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest --cov=deltasigma --cov-report=term-missing
      - name: Examples smoke test
        run: |
          python examples/01_vol_surface.py
          python examples/02_regime_simulation.py
          python examples/03_deep_hedging.py --quick
          python examples/04_vol_research.py --synthetic --quick
