[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deltasigma"
version = "0.1.0"
description = "AI-driven FX options pricing, hedging and market-making research lab"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Nithin B M", email = "nithinbm17@gmail.com" }]
keywords = ["fx-options", "quant", "volatility", "sabr", "vanna-volga", "heston", "machine-learning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.7"]
ml = ["torch>=2.2"]
research = ["pandas>=2.0", "scikit-learn>=1.3"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "scikit-learn>=1.3",
]

[project.urls]
Repository = "https://github.com/Nit17/DeltaSigma"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
